<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Didaxie</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href=".\css\login_professor.css">
</head>

<body>

    <main class="cadastro-page">

        <!-- LADO ESQUERDO -->
        <section class="lado-esquerdo">

            <a href="index.html" class="logo">
                DIDAXIE
            </a>

            <div class="ilustracao">
                <img
                    src="./img/computer.png"
                    alt="Pessoa utilizando computador"
                >
            </div>

        </section>


        <!-- LADO DIREITO -->
        <section class="lado-direito">

            <div class="card-cadastro">

                <!-- CABEÇALHO -->
                <div class="cabecalho">

                    <div class="icone-usuario">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <circle
                                cx="12"
                                cy="8"
                                r="4"
                                stroke="currentColor"
                                stroke-width="1.5"
                            />

                            <path
                                d="M4.5 20C4.5 15.8 7.8 12.5 12 12.5C16.2 12.5 19.5 15.8 19.5 20"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                            />
                        </svg>
                    </div>

                    <div>
                        <h1>Entrar</h1>
                        <p>Entre com sua conta Didaxie.</p>
                    </div>

                </div>


                <!-- FORMULÁRIO -->
                <form id="formCadastro" novalidate>

                    <div class="campos-principais">

                        <div class="campo">
                            <label for="email">E-mail</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                autocomplete="email"
                            >

                            <span class="mensagem-erro"></span>
                        </div>


                        <div class="campo">

                            <label for="senha">Senha</label>

                            <div class="senha-container">

                                <input
                                    type="password"
                                    id="senha"
                                    name="senha"
                                    autocomplete="current-password"
                                >

                                <button
                                    type="button"
                                    class="btn-ver-senha"
                                    id="btnVerSenha"
                                    aria-label="Mostrar senha"
                                >
                                    <svg
                                        viewBox="0 0 24 24"
                                        xmlns="http://www.w3.org/2000/svg"
                                    >
                                        <path
                                            d="M2.5 12S6 6.5 12 6.5S21.5 12 21.5 12S18 17.5 12 17.5S2.5 12 2.5 12Z"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="1.5"
                                        />

                                        <circle
                                            cx="12"
                                            cy="12"
                                            r="2.5"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="1.5"
                                        />
                                    </svg>
                                </button>

                            </div>

                            <span class="mensagem-erro"></span>

                        </div>

                    </div>


                    <!-- TERMOS -->
                    <label class="termos">

                        <input
                            type="checkbox"
                            id="termos"
                        >

                        <span class="checkbox-custom"></span>

                        <span>
                            Eu concordo com os
                            <a href="#">Termos de Uso</a>
                            e a
                            <a href="#">Política de Privacidade</a>.
                        </span>

                    </label>


                    <!-- BOTÃO -->
                    <button
                        type="submit"
                        class="btn-principal"
                    >
                        Entrar
                    </button>


                    <p class="possui-conta">
                        Ainda não possui uma conta?
                        <a href="cadastro_professor.html">
                            Cadastre-se
                        </a>
                    </p>


                    <!-- DIVISOR -->
                    <div class="divisor">

                        <span></span>

                        <p>ou entre com</p>

                        <span></span>

                    </div>


                    <!-- LOGIN SOCIAL -->
                    <div class="login-social">

                        <button
                            type="button"
                            class="btn-social"
                            id="googleLogin"
                        >

                            <svg
                                class="google-icon"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    fill="#4285F4"
                                    d="M21.35 12.18c0-.7-.06-1.2-.2-1.73H12v3.3h5.37a4.57 4.57 0 0 1-1.99 3v2.5h3.22c1.88-1.74 2.75-4.3 2.75-7.07Z"
                                />

                                <path
                                    fill="#34A853"
                                    d="M12 21.5c2.7 0 4.96-.9 6.6-2.43l-3.22-2.5c-.9.6-2.05.97-3.38.97-2.6 0-4.8-1.76-5.6-4.13H3.08v2.58A10 10 0 0 0 12 21.5Z"
                                />

                                <path
                                    fill="#FBBC05"
                                    d="M6.4 13.41A6 6 0 0 1 6.08 12c0-.5.09-.98.25-1.43V7.99H3.08A10 10 0 0 0 2 12c0 1.44.35 2.8 1.08 4Z"
                                />

                                <path
                                    fill="#EA4335"
                                    d="M12 6.46c1.47 0 2.8.5 3.84 1.52l2.83-2.84C16.95 3.52 14.7 2.5 12 2.5A10 10 0 0 0 3.08 8l3.25 2.57C7.15 8.2 9.4 6.46 12 6.46Z"
                                />
                            </svg>

                            Google

                        </button>


                        <button
                            type="button"
                            class="btn-social"
                            id="microsoftLogin"
                        >

                            <svg
                                class="microsoft-icon"
                                viewBox="0 0 24 24"
                            >
                                <rect
                                    x="2"
                                    y="2"
                                    width="9"
                                    height="9"
                                    fill="#F25022"
                                />

                                <rect
                                    x="13"
                                    y="2"
                                    width="9"
                                    height="9"
                                    fill="#7FBA00"
                                />

                                <rect
                                    x="2"
                                    y="13"
                                    width="9"
                                    height="9"
                                    fill="#00A4EF"
                                />

                                <rect
                                    x="13"
                                    y="13"
                                    width="9"
                                    height="9"
                                    fill="#FFB900"
                                />
                            </svg>

                            Microsoft

                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- TOAST -->
    <div class="toast" id="toast">
        <span id="toastTexto"></span>
    </div>


    <script src="javaScript/login_professor.js"></script>

</body>
</html>

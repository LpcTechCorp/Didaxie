<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materiais | Didaxie</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">

    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/materiais.css">
</head>

<body>
    <button class="mobile-menu-button" id="mobileMenuButton" aria-label="Abrir menu">
        <i class="fi fi-rr-menu-burger"></i>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="painel.html" class="logo">
                <span class="logo-completo">DIDAXIE</span>
                <span class="logo-reduzido">D</span>
            </a>

            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Recolher menu">
                <i class="fi fi-rr-angle-small-left"></i>
            </button>
        </div>

        <nav class="sidebar-menu">
            <a href="painel.html" class="menu-item" data-label="Início">
                <i class="fi fi-rr-home"></i>
                <span>Início</span>
            </a>

            <a href="plano_aula.html" class="menu-item" data-label="Plano de aula">
                <i class="fi fi-rr-book-open-cover"></i>
                <span>Plano de aula</span>
            </a>

            <a href="materiais.html" class="menu-item" data-label="Materiais">
                <i class="fi fi-rr-folder-open"></i>
                <span>Materiais</span>
            </a>

            <a href="atividades.html" class="menu-item" data-label="Atividades">
                <i class="fi fi-rr-document"></i>
                <span>Atividades</span>
            </a>

            <a href="correcao.html" class="menu-item" data-label="Correção">
                <i class="fi fi-rr-edit"></i>
                <span>Correção</span>
            </a>

            <a href="calendario.html" class="menu-item" data-label="Calendário">
                <i class="fi fi-rr-calendar"></i>
                <span>Calendário</span>
            </a>
        </nav>

        <a href="configuracoes.html" class="profile-card">
            <div class="profile-avatar">PF</div>

            <div class="profile-info">
                <strong>Professor</strong>
                <span>Ver perfil</span>
            </div>

            <i class="fi fi-rr-angle-small-right profile-arrow"></i>
        </a>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="materiais-page">
        <header class="materiais-header">
            <h1>Materiais</h1>
        </header>

        <section class="materiais-filtros">
            <div class="busca-container">
                <i class="fi fi-rr-search"></i>
                <input type="search" id="buscarMaterial" placeholder="Buscar materiais" autocomplete="off">
            </div>

            <div class="filtro">
                <label for="filtroTurma">Turmas</label>
                <select id="filtroTurma">
                    <option value="">Todas</option>
                </select>
            </div>

            <div class="filtro">
                <label for="filtroTipo">Tipo</label>
                <select id="filtroTipo">
                    <option value="">Todos</option>
                </select>
            </div>

            <a href="enviar_material.html" class="botao-enviar">
                <i class="fi fi-rr-plus"></i>
                <span>Enviar</span>
            </a>
        </section>

        <section class="arquivos">
            <div class="arquivos-titulo">
                <h2>Arquivos recentes</h2>
                <div class="titulo-linha"></div>
            </div>

            <div class="arquivos-lista" id="arquivosLista"></div>
        </section>
    </main>

    <script src="javaScript/navbar.js"></script>
    <script src="javaScript/materiais.js"></script>
</body>
</html>
